<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="CATÁLOGO DIGITAL — Explore camisas por liga, clube e seleção.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CATÁLOGO DIGITAL">
  <meta property="og:description" content="Catálogos de camisas de futebol por liga, clube e seleção.">
  <title>CATÁLOGO DIGITAL | Catálogo Esportivo</title>
  <link rel="icon" href="./assets/imagens/favicon.png" type="image/png">
  <link rel="preload" href="./assets/imagens/logo-catalogo-digital.png" as="image">
  <link rel="stylesheet" href="./style.css">
  <script src="./configuracao.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body id="inicio">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <div class="header-side header-side--left">
        <button class="icon-button" type="button" id="menu-button" aria-label="Abrir menu de navegação" aria-controls="navigation-panel" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6.5h18M3 12h18M3 17.5h18"/></svg>
        </button>
      </div>
      <a class="brand" href="#inicio" id="brand-link" aria-label="Catálogo Digital — voltar ao início">
        <img src="./assets/imagens/logo-catalogo-digital.png" alt="CATÁLOGO DIGITAL" width="1056" height="311" decoding="async">
      </a>
      <div class="header-side header-side--right">
        <button class="icon-button" type="button" id="search-button" aria-label="Pesquisar ligas, clubes e seleções" aria-controls="search-panel" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="contacts" id="contacts" aria-label="Contatos"></div>
  <main id="conteudo" tabindex="-1" aria-label="Catálogos de camisas"></main>
  <footer class="site-footer" id="site-footer"><span id="footer-name">CATÁLOGO DIGITAL</span><span>© <span id="footer-year"></span> — Todos os direitos reservados.</span></footer>

  <div class="overlay" id="nav-overlay" hidden>
    <div class="overlay-backdrop" data-close="nav"></div>
    <nav class="navigation-panel" id="navigation-panel" aria-label="Navegação principal" aria-modal="true" role="dialog" aria-labelledby="nav-title" tabindex="-1">
      <div class="panel-header"><span class="panel-title" id="nav-title">MENU</span>
        <button class="icon-button panel-close" type="button" id="close-menu" aria-label="Fechar menu">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5 19 19M19 5 5 19"/></svg>
        </button>
      </div>
      <div class="navigation-content" id="navigation-content"></div>
    </nav>
  </div>

  <div class="overlay overlay--search" id="search-overlay" hidden>
    <div class="overlay-backdrop" data-close="search"></div>
    <section class="search-panel" id="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title" tabindex="-1">
      <div class="panel-header"><span class="panel-title" id="search-title">PESQUISAR</span>
        <button class="icon-button panel-close" type="button" id="close-search" aria-label="Fechar pesquisa">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5 19 19M19 5 5 19"/></svg>
        </button>
      </div>
      <div class="search-field">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input type="search" id="search-input" autocomplete="off" spellcheck="false" placeholder="Busque um clube, seleção ou liga..." aria-label="Pesquisar clubes, seleções ou ligas" aria-controls="search-results">
      </div>
      <div class="search-results" id="search-results" role="region" aria-label="Resultados da pesquisa" aria-live="polite"></div>
    </section>
  </div>

  <noscript><p class="noscript-message">Ative o JavaScript para visualizar os clubes e acessar seus catálogos.</p></noscript>
</body>
</html>
